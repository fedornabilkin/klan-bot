name: klan-bot

services:
  bot:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Docker/.env}
      BOT_BACKEND_SECRET: ${BOT_BACKEND_SECRET:?Set BOT_BACKEND_SECRET in Docker/.env}
      BOT_BACKEND_URL: ${CONTAINER_BACKEND_URL:-http://host.docker.internal:3001}
      BOT_STATE_FILE: /var/lib/klan-bot/offset.json
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - bot-state:/var/lib/klan-bot

volumes:
  bot-state:
