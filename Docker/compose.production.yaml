name: klan-bot-production

services:
  bot:
    image: ${IMAGE_REF:?Set IMAGE_REF to the published image digest}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - path: ../runtime.env
        format: raw
    environment:
      NODE_ENV: production
      BOT_STATE_FILE: /var/lib/klan-bot/offset.json
    networks:
      - production
    volumes:
      - bot-state:/var/lib/klan-bot
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}

networks:
  production:
    external: true
    name: klan-production

volumes:
  bot-state:
    external: true
    name: klan-production-bot-state
